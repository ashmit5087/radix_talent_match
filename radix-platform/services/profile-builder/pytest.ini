[pytest]
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:storage3.*
    ignore:.*extra='allow'.*:pydantic.warnings.PydanticDeprecatedSince20
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
    ignore:.*RequestsDependencyWarning.*
