[project]
name = "skill-matching"
version = "1.0.0"
description = "RADIX Talent Match - Role 5: Skill Matching (deterministic, explainable)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
llm = ["openai>=1.30"]

[project.scripts]
skill-match = "skill_matching.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_matching"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
